name: TRL Scan

on:
  push:
    branches: [ "stagingV1" ]
  pull_request:

jobs:
  trl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install TRL
        run: pip install -r requirements.txt

      - name: Run TRL
        run: |
          python -m trl optimize ./examples/demo/good.yaml --dry-run --output=json > report.json

      - name: Fail on errors
        run: |
          cat report.json | jq -r '.summary.status' | grep FAILED && exit 1 || exit 0