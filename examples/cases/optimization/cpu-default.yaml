apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cpu-default
  template:
    metadata:
      labels:
        app: cpu-default
    spec:
      containers:
        - name: backend
          image: nginx:1.25
          ports:
            - containerPort: 5000
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
          resources:
            requests:
              memory: "128Mi"
            limits:
              cpu: "100m"
              memory: "512Mi"