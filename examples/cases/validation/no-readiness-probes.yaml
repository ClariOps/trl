apiVersion: apps/v1
kind: Deployment
metadata:
  name: no-probes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: no-probes
  template:
    metadata:
      labels:
        app: no-probes
    spec:
      containers:
        - name: backend
          image: nginx:1.25
          ports:
            - containerPort: 5000
          securityContext:
            runAsUser: 1000 
            allowPrivilegeEscalation: false
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

