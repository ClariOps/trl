apiVersion: apps/v1
kind: Deployment
metadata:
  name: replica-scaling
spec:
  replicas: 1
  selector:
    matchLabels:
      app: replica-scaling
  template:
    metadata:
      labels:
        app: replica-scaling
    spec:
      containers:
        - name: backend
          image: nginx:1.25
          ports:
            - containerPort: 5000
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "600m"
              memory: "512Mi"