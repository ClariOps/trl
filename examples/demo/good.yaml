apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-clean
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-clean
  template:
    metadata:
      labels:
        app: backend-clean
    spec:
      containers:
        - name: backend
          image: nginx:1.25
          ports:
            - containerPort: 5000
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-clean-service
spec:
  type: ClusterIP
  selector:
    app: backend-clean
  ports:
    - port: 80
      targetPort: 5000