apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend

spec:

  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: nginx:latest
        securityContext: 
          privileged: true
          runAsUser: 000
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        volumeMounts:
        - name: upload-vol
          mountPath: /app/uploads
      volumes:
      - name: upload-vol
        emptyDir: {} 
      