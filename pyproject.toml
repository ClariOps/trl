[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clariops-trl"
version = "0.1.3"
description = "..."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "certifi==2025.8.3",
    "charset-normalizer==3.4.3",
    "idna==3.10",
    "pykube-ng==23.6.0",
    "PyYAML==6.0.2",
    "requests==2.32.5",
    "urllib3==2.5.0",
]

[project.scripts]
trl = "trl.cli.main:main"

[tool.setuptools.packages.find]
include = ["trl*"]
