apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend

spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: sufder-app-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 4000
        volumeMounts:
        - name: upload-vol
          mountPath: /app/uploads
      volumes:
      - name: upload-vol
        emptyDir: {} 
      