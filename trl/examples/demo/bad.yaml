apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: nginx:latest   # 🔴 latest-tag
          ports:
            - containerPort: 5000
          securityContext:
            privileged: False    # 🔴 privileged-container
          resources:
            requests:
              cpu: "50m"        # 🔴 under-provisioning
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: NodePort             # 🔴 nodeport-exposure
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30030